name: generate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  generate:
    name: Generate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    permissions:
      contents: write
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Checkout swift-package-collection-generator
        uses: actions/checkout@v3
        with:
          repository: apple/swift-package-collection-generator
          ref: refs/heads/5.10
          path: swift-package-collection-generator
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: swift-package-collection-generator/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('generator/Package.resolved') }}
      - name: Build swift-package-collection-generator
        run: |
          cd swift-package-collection-generator
          swift build --configuration release
      - name: Generate Content
        run: |
          echo "🕐 当前时间: $(date '+%Y-%m-%d %H:%M:%S')"
          # 设置目录路径
          BASE_DIR="dist/gh-pages"
          # 创建目录
          mkdir -p "$BASE_DIR"
          #
          ./swift-package-collection-generator/.build/release/package-collection-generate packages.json $BASE_DIR/collection.json
      - name: Checkout Github Pages
        continue-on-error: true # 忽略 gh-pages 分支未创建
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages
      - name: Merge Github Pages
        run: |
          # 避免 gh-pages 分支未创建
          mkdir -p gh-pages‌
          #
          if [ -d dist/gh-pages ]; then cp -rf dist/gh-pages/. gh-pages/; fi
      - name: Deploy Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gh-pages
          branch: gh-pages
